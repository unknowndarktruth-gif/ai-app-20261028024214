<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Car Racing Game</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .track {
    background: linear-gradient(to bottom, #444, #222);
    border: 4px solid #555;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
  }
  .car {
    width: 40px;
    height: 80px;
    background: #3b82f6;
    border-radius: 8px 8px 0 0;
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
  }
  .obstacle {
    width: 40px;
    height: 80px;
    background: #ef4444;
    border-radius: 8px 8px 0 0;
    position: absolute;
  }
  .overlay {
    background: rgba(0,0,0,0.7);
    color: #fff;
    font-size: 2rem;
  }
</style>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen p-4">
  <div class="w-full max-w-md mx-auto">
    <div class="flex flex-col items-center space-y-4">
      <h1 class="text-3xl font-bold text-white">Car Racing Game</h1>
      <div id="track" class="track w-full h-96 relative overflow-hidden">
        <div id="car" class="car"></div>
      </div>
      <div class="flex items-center space-x-4">
        <button id="startBtn" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">Start</button>
        <span class="text-white">Score: <span id="score">0</span></span>
      </div>
    </div>
    <div id="overlay" class="overlay hidden absolute inset-0 flex flex-col items-center justify-center">
      <div id="gameOverText">Game Over</div>
      <button id="restartBtn" class="mt-4 px-4 py-2 bg-yellow-500 text-white rounded hover:bg-yellow-600">Restart</button>
    </div>
  </div>

<script>
const track = document.getElementById('track');
const car = document.getElementById('car');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('score');

let gameInterval, obstacleInterval;
let obstacles = [];
let carPos = 50; // percent
let score = 0;
let isRunning = false;

function resetGame() {
  obstacles.forEach(o => o.remove());
  obstacles = [];
  carPos = 50;
  car.style.left = `${carPos}%`;
  score = 0;
  scoreEl.textContent = score;
  overlay.classList.add('hidden');
}

function startGame() {
  if (isRunning) return;
  isRunning = true;
  resetGame();
  gameInterval = setInterval(updateGame, 20);
  obstacleInterval = setInterval(createObstacle, 1500);
}

function stopGame() {
  clearInterval(gameInterval);
  clearInterval(obstacleInterval);
  isRunning = false;
  overlay.classList.remove('hidden');
}

function createObstacle() {
  const obstacle = document.createElement('div');
  obstacle.className = 'obstacle';
  const leftPercent = Math.random() * 80; // 0-80%
  obstacle.style.left = `${leftPercent}%`;
  obstacle.style.top = '-80px';
  track.appendChild(obstacle);
  obstacles.push(obstacle);
}

function updateGame() {
  obstacles.forEach((o, index) => {
    const top = parseFloat(o.style.top);
    o.style.top = `${top + 5}px`;
    if (top > track.clientHeight) {
      o.remove();
      obstacles.splice(index, 1);
      score++;
      scoreEl.textContent = score;
    } else {
      const carRect = car.getBoundingClientRect();
      const obsRect = o.getBoundingClientRect();
      if (!(carRect.right < obsRect.left || carRect.left > obsRect.right || carRect.bottom < obsRect.top || carRect.top > obsRect.bottom)) {
        stopGame();
      }
    }
  });
}

document.addEventListener('keydown', e => {
  if (!isRunning) return;
  if (e.key === 'ArrowLeft' && carPos > 5) carPos -= 5;
  if (e.key === 'ArrowRight' && carPos < 95) carPos += 5;
  car.style.left = `${carPos}%`;
});

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);
</script>
</body>
